name: CI/CD

on: [push, workflow_dispatch]

env:
  PYTHON_MAJOR_VERSION: '3.13'
  PYTHON_VERSION: '3.13.5'

jobs:
  windows-ffmpeg:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: setup msys2 and install ffmpeg dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            git
            subversion
            make
            autotools
            libtool
            diffutils
            coreutils
            findutils
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm

      - name: clone ffmpeg
        run: |
          git clone \
            --depth 1 \
            --branch release/9.0 \
            --single-branch \
            https://github.com/ffmpeg/ffmpeg.git \
            .

      - name: build lame
        run: |
          svn checkout svn://svn.code.sf.net/p/lame/svn/tags/RELEASE__3_100 lame
          cd lame/lame
          export CFLAGS="-O3 -flto"
          export CPPFLAGS="-O3 -flto"
          export LDFLAGS="-flto"
          ./configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/deps" \
            --disable-frontend \
            --enable-static \
            --disable-shared
          make -j $(nproc)
          make install

      - name: build opus
        run: |
          git clone --depth 1 --branch v1.6.1 https://github.com/xiph/opus.git opus
          cd opus
          export CFLAGS="-O3 -flto"
          export CPPFLAGS="-O3 -flto"
          export LDFLAGS="-flto"

          ./autogen.sh
          ./configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/deps" \
            --enable-static \
            --disable-shared \
            --disable-extra-programs \
            --enable-rtcd

          make -j $(nproc)
          make install

      - name: build ogg
        run: |
          git clone --depth 1 --branch v1.3.6 https://github.com/xiph/ogg.git ogg
          cd ogg
          export CFLAGS="-O3 -flto"
          export CPPFLAGS="-O3 -flto"
          export LDFLAGS="-flto"

          ./autogen.sh
          ./configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/deps" \
            --enable-static \
            --disable-shared

          make -j $(nproc)
          make install

      - name: build vorbis
        run: |
          git clone --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis.git vorbis
          cd vorbis
          export PKG_CONFIG_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/deps/lib/pkgconfig"
          export CFLAGS="-O3 -flto"
          export CPPFLAGS="-O3 -flto"
          export LDFLAGS="-flto"

          ./autogen.sh
          ./configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/deps" \
            --enable-static \
            --disable-shared \
            --disable-docs \
            --disable-examples

          make -j $(nproc)
          make install

      - name: build ffmpeg
        run: |
          export PKG_CONFIG_PATH="$(cygpath -u "$GITHUB_WORKSPACE")/deps/lib/pkgconfig"
          export CPPFLAGS="-I$(cygpath -u "$GITHUB_WORKSPACE")/deps/include -O3"
          export LDFLAGS="-L$(cygpath -u "$GITHUB_WORKSPACE")/deps/lib"

          ./configure \
            --prefix="$(cygpath -u "$GITHUB_WORKSPACE")/deps" \
            --disable-everything \
            --disable-autodetect \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --enable-ffmpeg \
            --pkg-config-flags=--static \
            --extra-ldflags=-static \
            --enable-static \
            --disable-shared \
            --enable-lto \
            --enable-protocol=file \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-decoder=mp3,opus,vorbis,aac \
            --enable-demuxer=mp3,matroska,mp4,mov \
            --enable-muxer=adts,ogg,mp3,null,wav \
            --enable-encoder=aac,libmp3lame,libopus,libvorbis,pcm_s16le \
            --enable-filter=volume,aresample,pan,volumedetect

          make -j $(nproc)

      - uses: actions/upload-artifact@v7
        with: 
          name: windows-ffmpeg
          path: ffmpeg.exe



  windows-karaluxer-gui:
    runs-on: windows-latest
    needs: windows-ffmpeg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-ffmpeg
          path: tools

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install dependencies
        run: python -m pip install .

      - name: Create bundle
        run: |
          pyinstaller kl_gui.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: ${{ github.workspace }}\dist\*.exe
          retention-days: 90


  macos-ffmpeg:
    runs-on: macos-latest
    steps:
      - name: install ffmpeg dependencies
        run: |
          brew update
          brew install \
            pkg-config \
            autoconf \
            automake \
            libtool \
            nasm \
            subversion

      - name: clone ffmpeg
        run: |
          git clone \
            --depth 1 \
            --branch release/9.0 \
            --single-branch \
            https://github.com/ffmpeg/ffmpeg.git \
            .

      - name: build lame
        run: |
          svn checkout svn://svn.code.sf.net/p/lame/svn/tags/RELEASE__3_100 lame
          cd lame/lame
          ./configure \
            --prefix="$GITHUB_WORKSPACE/deps" \
            --disable-frontend \
            --enable-static \
            --disable-shared

          make -j $(sysctl -n hw.ncpu)
          make install

      - name: build opus
        run: |
          git clone --depth 1 --branch v1.6.1 https://github.com/xiph/opus opus
          cd opus
          export CFLAGS="-O3 -flto"
          export CPPFLAGS="-O3 -flto"
          export LDFLAGS="-flto"

          ./autogen.sh
          ./configure \
            --prefix="$GITHUB_WORKSPACE/deps" \
            --enable-static \
            --disable-shared \
            --disable-extra-programs \
            --enable-rtcd

          make -j $(sysctl -n hw.ncpu)
          make install

      - name: build ogg
        run: |
          git clone --depth 1 --branch v1.3.6 https://github.com/xiph/ogg.git ogg
          cd ogg
          export CFLAGS="-O3 -flto"
          export CPPFLAGS="-O3 -flto"
          export LDFLAGS="-flto"

          ./autogen.sh
          ./configure \
            --prefix="$GITHUB_WORKSPACE/deps" \
            --enable-static \
            --disable-shared

          make -j $(sysctl -n hw.ncpu)
          make install

      - name: build vorbis
        run: |
          git clone --depth 1 --branch v1.3.7 https://github.com/xiph/vorbis.git vorbis
          cd vorbis

          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/deps/lib/pkgconfig"
          export CFLAGS="-O3 -flto"
          export CPPFLAGS="-O3 -flto"
          export LDFLAGS="-flto"

          ./autogen.sh

          # flag does not exist, patch it away
          sed -i '' 's/-force_cpusubtype_ALL//g' configure

          ./configure \
            --prefix="$GITHUB_WORKSPACE/deps" \
            --enable-static \
            --disable-shared \
            --disable-docs \
            --disable-examples

          make -j $(sysctl -n hw.ncpu)
          make install

      - name: build ffmpeg
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/deps/lib/pkgconfig"
          export CPPFLAGS="-I$GITHUB_WORKSPACE/deps/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/deps/lib"

          ./configure \
            --prefix="$GITHUB_WORKSPACE/deps" \
            --disable-everything \
            --disable-autodetect \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --enable-ffmpeg \
            --enable-static \
            --disable-shared \
            --pkg-config-flags=--static \
            --enable-lto \
            --enable-protocol=file \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-decoder=mp3,opus,vorbis,aac \
            --enable-demuxer=mp3,matroska,mp4,mov \
            --enable-muxer=adts,ogg,mp3,null,wav \
            --enable-encoder=aac,libmp3lame,libopus,libvorbis,pcm_s16le \
            --enable-filter=volume,aresample,pan,volumedetect
      
          make -j $(sysctl -n hw.ncpu)

      - uses: actions/upload-artifact@v7
        with: 
          name: macos-ffmpeg
          path: ffmpeg

  macos-karaluxer-gui:
    runs-on: macos-latest
    needs: macos-ffmpeg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: macos-ffmpeg
          path: tools

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install dependencies
        run: python -m pip install .

      - name: Create bundle
        run: |
          mv tools/ffmpeg tools/ffmpeg.exe
          pyinstaller kl_gui.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: ${{ github.workspace }}/dist/*
          retention-days: 90


  ubuntu-ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - name: install ffmpeg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            nasm \
            libmp3lame-dev \
            libvorbis-dev \
            libopus-dev

      - name: clone ffmpeg
        run: |
          git clone \
            --depth 1 \
            --branch release/9.0 \
            --single-branch \
            https://github.com/ffmpeg/ffmpeg.git \
            .

      - name: build ffmpeg
        run: |
          ./configure \
            --disable-everything \
            --disable-autodetect \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --enable-ffmpeg \
            --enable-static \
            --disable-shared \
            --pkg-config-flags=--static \
            --enable-lto \
            --enable-protocol=file \
            --enable-libmp3lame \
            --enable-libopus \
            --enable-libvorbis \
            --enable-decoder=mp3,opus,vorbis,aac \
            --enable-demuxer=mp3,matroska,mp4,mov \
            --enable-muxer=adts,ogg,mp3,null,wav \
            --enable-encoder=aac,libmp3lame,libopus,libvorbis,pcm_s16le \
            --enable-filter=volume,aresample,pan,volumedetect
      
          make -j $(nproc)

      - uses: actions/upload-artifact@v7
        with: 
          name: ubuntu-ffmpeg
          path: ffmpeg

  ubuntu-karaluxer-gui:
    runs-on: ubuntu-latest
    needs: ubuntu-ffmpeg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ubuntu-ffmpeg
          path: tools

      - name: Install python
        uses: actions/setup-python@v6
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install dependencies
        run: python -m pip install .

      - name: Create bundle
        run: |
          mv tools/ffmpeg tools/ffmpeg.exe
          pyinstaller kl_gui.spec

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu
          path: ${{ github.workspace }}/dist/*
          retention-days: 90
